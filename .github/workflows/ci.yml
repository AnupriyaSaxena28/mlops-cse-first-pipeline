name: Iris ML API - CI Pipeline - CSE

# Define when GitHub should run this workflow.
on:
# Run CI whenever code is pushed to main branch
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
  
# permissions are restricted to read repo content
permissions:
  contents: read
  packages: write

# Define the jobs that make up the pipeline
jobs:
  # JOB-1: Test
  test:
    # GitHub repo provides a fresh Ubuntu virtual environment for this job
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      # Step-1: Download the repo content to the runner
      # Without this, the runner would not have required project files
      - name: Check out repository
        uses: actions/checkout@v4
      
      # Step-2: Install Python on the runner
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      # Step-3: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step-4: Execute the automated tests
      - name: Run automated tests
        run: python -m pytest -v
      

  # JOB-2: Build and Publish Docker Image
  build-and-push:
    name: Build and Publish to Amazon ECR
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC Subject: ${payload.sub}`);
            core.info(`OIDC Audience: ${payload.aud}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Repository ID: ${payload.repository_id}`);
            core.info(`Owner ID: ${payload.repository_owner_id}`);
            
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
